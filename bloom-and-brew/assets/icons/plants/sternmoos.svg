<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Moos-Gradient -->
    <radialGradient id="mossGrad" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#4CAF50"/>
      <stop offset="50%" stop-color="#388E3C"/>
      <stop offset="100%" stop-color="#2E7D32"/>
    </radialGradient>
    <!-- Moos dunklere Schicht -->
    <radialGradient id="mossDark" cx="45%" cy="55%" r="50%">
      <stop offset="0%" stop-color="#388E3C"/>
      <stop offset="100%" stop-color="#1B5E20"/>
    </radialGradient>
    <!-- Nachtblauer Hintergrund-Glow -->
    <radialGradient id="nightGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#1A237E" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#1A237E" stop-opacity="0"/>
    </radialGradient>
    <!-- Stern-Glow -->
    <filter id="starGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Sanfter Stern-Glow -->
    <filter id="starGlowSoft">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Samtiger Textur-Filter -->
    <filter id="velvet">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="3" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <!-- Rahmen -->
    <linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0F0F0"/>
      <stop offset="50%" stop-color="#E0E0E0"/>
      <stop offset="100%" stop-color="#D0D0D0"/>
    </linearGradient>
  </defs>

  <!-- Hintergrund (tiefes Nachtblau) -->
  <rect width="512" height="512" rx="24" fill="#0D1117"/>

  <!-- Nacht-Atmosphäre -->
  <circle cx="256" cy="280" r="200" fill="url(#nightGlow)"/>

  <!-- Schatten am Boden -->
  <ellipse cx="256" cy="395" rx="110" ry="18" fill="#060810" opacity="0.5"/>

  <!-- === MOOS-KÖRPER (Kugelform) === -->

  <!-- Basis-Kugel -->
  <ellipse cx="256" cy="300" rx="120" ry="95" fill="url(#mossDark)"/>

  <!-- Obere Moos-Schicht (heller, samtig) -->
  <ellipse cx="256" cy="290" rx="115" ry="88" fill="url(#mossGrad)"/>

  <!-- Moos-Textur (kleine Hügel/Büschel) -->
  <circle cx="210" cy="270" r="28" fill="#43A047" opacity="0.6"/>
  <circle cx="300" cy="275" r="25" fill="#43A047" opacity="0.5"/>
  <circle cx="256" cy="255" r="30" fill="#4CAF50" opacity="0.5"/>
  <circle cx="235" cy="300" r="22" fill="#2E7D32" opacity="0.4"/>
  <circle cx="280" cy="310" r="20" fill="#2E7D32" opacity="0.3"/>
  <circle cx="195" cy="305" r="18" fill="#388E3C" opacity="0.35"/>
  <circle cx="315" cy="300" r="18" fill="#388E3C" opacity="0.35"/>
  <circle cx="256" cy="320" r="24" fill="#1B5E20" opacity="0.3"/>

  <!-- Lichtreflexion oben (samtig) -->
  <ellipse cx="240" cy="250" rx="50" ry="25" fill="#66BB6A" opacity="0.2"/>
  <ellipse cx="245" cy="245" rx="30" ry="15" fill="#81C784" opacity="0.15"/>

  <!-- === STERN-PUNKTE IM MOOS === -->
  <g filter="url(#starGlowSoft)">
    <!-- Größere Sterne (eingebettet ins Moos) -->
    <circle cx="225" cy="265" r="3.5" fill="#FFEB3B" opacity="0.9"/>
    <circle cx="275" cy="278" r="3" fill="#FFEB3B" opacity="0.85"/>
    <circle cx="250" cy="290" r="2.5" fill="#FFF176" opacity="0.8"/>
    <circle cx="200" cy="290" r="3" fill="#FFEB3B" opacity="0.75"/>
    <circle cx="310" cy="285" r="2.5" fill="#FFF176" opacity="0.8"/>
    <circle cx="240" cy="310" r="2.5" fill="#FFEB3B" opacity="0.7"/>
    <circle cx="290" cy="302" r="3" fill="#FFEB3B" opacity="0.8"/>
    <circle cx="265" cy="260" r="2.5" fill="#FFF176" opacity="0.85"/>
    <circle cx="215" cy="305" r="2" fill="#FFEB3B" opacity="0.65"/>
    <circle cx="300" cy="265" r="2" fill="#FFF176" opacity="0.75"/>

    <!-- Mittlere Sterne -->
    <circle cx="235" cy="280" r="2" fill="#00BCD4" opacity="0.6"/>
    <circle cx="280" cy="295" r="2" fill="#00BCD4" opacity="0.55"/>
    <circle cx="255" cy="305" r="1.5" fill="#FFEB3B" opacity="0.6"/>
    <circle cx="320" cy="295" r="1.5" fill="#FFF176" opacity="0.5"/>
    <circle cx="190" cy="295" r="1.5" fill="#00BCD4" opacity="0.45"/>

    <!-- Kleine Lichtpunkte -->
    <circle cx="208" cy="275" r="1" fill="#FFEB3B" opacity="0.5"/>
    <circle cx="270" cy="268" r="1" fill="#FFF176" opacity="0.5"/>
    <circle cx="295" cy="310" r="1" fill="#FFEB3B" opacity="0.4"/>
    <circle cx="225" cy="315" r="1" fill="#00BCD4" opacity="0.4"/>
    <circle cx="245" cy="252" r="1" fill="#FFF176" opacity="0.5"/>
  </g>

  <!-- === SCHWEBENDE STERNCHEN-PARTIKEL === -->
  <g filter="url(#starGlow)">
    <!-- Sternchen 1 (6-zackig) -->
    <g transform="translate(200, 210)">
      <polygon points="0,-8 2,-2 8,0 2,2 0,8 -2,2 -8,0 -2,-2" fill="#FFEB3B" opacity="0.8"/>
    </g>

    <!-- Sternchen 2 -->
    <g transform="translate(310, 220)">
      <polygon points="0,-7 1.5,-1.5 7,0 1.5,1.5 0,7 -1.5,1.5 -7,0 -1.5,-1.5" fill="#FFF176" opacity="0.7"/>
    </g>

    <!-- Sternchen 3 -->
    <g transform="translate(255, 195)">
      <polygon points="0,-9 2.5,-2.5 9,0 2.5,2.5 0,9 -2.5,2.5 -9,0 -2.5,-2.5" fill="#FFEB3B" opacity="0.75"/>
    </g>

    <!-- Sternchen 4 (kleiner) -->
    <g transform="translate(180, 245)">
      <polygon points="0,-5 1,-1 5,0 1,1 0,5 -1,1 -5,0 -1,-1" fill="#00BCD4" opacity="0.6"/>
    </g>

    <!-- Sternchen 5 (kleiner) -->
    <g transform="translate(330, 250)">
      <polygon points="0,-5 1,-1 5,0 1,1 0,5 -1,1 -5,0 -1,-1" fill="#FFF176" opacity="0.55"/>
    </g>

    <!-- Sternchen 6 (winzig, weit oben) -->
    <g transform="translate(230, 175)">
      <polygon points="0,-4 0.8,-0.8 4,0 0.8,0.8 0,4 -0.8,0.8 -4,0 -0.8,-0.8" fill="#FFEB3B" opacity="0.45"/>
    </g>

    <!-- Sternchen 7 -->
    <g transform="translate(285, 185)">
      <polygon points="0,-4 0.8,-0.8 4,0 0.8,0.8 0,4 -0.8,0.8 -4,0 -0.8,-0.8" fill="#00BCD4" opacity="0.4"/>
    </g>

    <!-- Leuchtpunkte dazwischen -->
    <circle cx="220" cy="228" r="2" fill="#FFEB3B" opacity="0.5"/>
    <circle cx="295" cy="235" r="1.5" fill="#FFF176" opacity="0.45"/>
    <circle cx="260" cy="210" r="1.5" fill="#FFEB3B" opacity="0.4"/>
  </g>

  <!-- Kleiner Erdhügel/Steinchen -->
  <ellipse cx="256" cy="392" rx="55" ry="10" fill="#3E2723" opacity="0.5"/>
  <ellipse cx="256" cy="390" rx="45" ry="7" fill="#4E342E" opacity="0.6"/>

  <!-- === RARITÄTS-RAHMEN (Common) === -->
  <rect x="6" y="6" width="500" height="500" rx="20" fill="none"
        stroke="url(#frameGrad)" stroke-width="6" opacity="0.9"/>
  <rect x="10" y="10" width="492" height="492" rx="18" fill="none"
        stroke="#F5F5F5" stroke-width="1" opacity="0.3"/>
</svg>
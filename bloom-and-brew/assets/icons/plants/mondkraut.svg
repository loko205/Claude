<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Mondlicht-Glow -->
    <radialGradient id="moonGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#F0F0FF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#F0F0FF" stop-opacity="0"/>
    </radialGradient>
    <!-- Blatt-Gradient silbrig-blau -->
    <linearGradient id="leafSilver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C8D8EB"/>
      <stop offset="40%" stop-color="#B0C4DE"/>
      <stop offset="100%" stop-color="#8FA8C8"/>
    </linearGradient>
    <!-- Blatt-Gradient dunklere Variante -->
    <linearGradient id="leafSilverDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A0B4CE"/>
      <stop offset="50%" stop-color="#8FA8C8"/>
      <stop offset="100%" stop-color="#7090B0"/>
    </linearGradient>
    <!-- Perlmutt-Schimmer -->
    <linearGradient id="pearlSheen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E1BEE7" stop-opacity="0"/>
      <stop offset="50%" stop-color="#E1BEE7" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#E1BEE7" stop-opacity="0"/>
    </linearGradient>
    <!-- Stiel-Gradient -->
    <linearGradient id="stemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3E8E41"/>
      <stop offset="100%" stop-color="#2E7D32"/>
    </linearGradient>
    <!-- Blattspitzen-Glow -->
    <filter id="tipGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Partikel-Glow -->
    <filter id="particleGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Schatten unter Pflanze -->
    <filter id="plantShadow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feOffset dx="2" dy="4" result="offset"/>
      <feMerge>
        <feMergeNode in="offset"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Rahmen-Gradient -->
    <linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0F0F0"/>
      <stop offset="50%" stop-color="#E0E0E0"/>
      <stop offset="100%" stop-color="#D0D0D0"/>
    </linearGradient>
  </defs>

  <!-- Hintergrund (sanftes Dunkelblau) -->
  <rect width="512" height="512" rx="24" fill="#1A1A2E"/>

  <!-- Mondlicht-Atmosphäre -->
  <circle cx="256" cy="200" r="200" fill="url(#moonGlow)"/>

  <!-- Schatten am Boden -->
  <ellipse cx="256" cy="420" rx="100" ry="16" fill="#0D0D1A" opacity="0.5"/>

  <!-- === PFLANZE === -->
  <g filter="url(#plantShadow)">

    <!-- Hauptstiel -->
    <path d="M256 410 Q254 360 252 320 Q250 280 256 240" stroke="url(#stemGrad)" stroke-width="8" fill="none" stroke-linecap="round"/>

    <!-- Nebenstiele -->
    <path d="M253 340 Q230 310 200 290" stroke="url(#stemGrad)" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M255 310 Q280 280 310 265" stroke="url(#stemGrad)" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M254 280 Q225 255 195 235" stroke="url(#stemGrad)" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M256 260 Q275 240 300 225" stroke="url(#stemGrad)" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M256 245 Q245 220 238 195" stroke="url(#stemGrad)" stroke-width="3.5" fill="none" stroke-linecap="round"/>

    <!-- Blatt 1 — links unten (groß) -->
    <path d="M200 290 Q175 275 160 250 Q155 235 165 225 Q175 218 190 225 Q210 240 225 270 Q230 280 220 288 Z"
          fill="url(#leafSilver)" stroke="#8FA8C8" stroke-width="1"/>
    <!-- Blattadern -->
    <path d="M200 290 Q185 268 170 245" stroke="#9AB4CE" stroke-width="1" fill="none" opacity="0.6"/>
    <path d="M195 278 Q185 262 178 248" stroke="#9AB4CE" stroke-width="0.7" fill="none" opacity="0.4"/>
    <!-- Gezackte Spitze mit Glow -->
    <circle cx="162" cy="237" r="5" fill="#F0F0FF" opacity="0.8" filter="url(#tipGlow)"/>

    <!-- Blatt 2 — rechts (groß) -->
    <path d="M310 265 Q335 250 350 225 Q355 210 345 200 Q335 195 320 205 Q300 220 285 250 Q280 260 290 265 Z"
          fill="url(#leafSilver)" stroke="#8FA8C8" stroke-width="1"/>
    <path d="M310 265 Q325 242 342 218" stroke="#9AB4CE" stroke-width="1" fill="none" opacity="0.6"/>
    <path d="M305 252 Q318 238 332 220" stroke="#9AB4CE" stroke-width="0.7" fill="none" opacity="0.4"/>
    <circle cx="348" cy="212" r="5" fill="#F0F0FF" opacity="0.8" filter="url(#tipGlow)"/>

    <!-- Blatt 3 — links oben -->
    <path d="M195 235 Q172 218 158 195 Q154 180 162 172 Q172 168 182 178 Q198 195 210 220 Q214 228 205 233 Z"
          fill="url(#leafSilverDark)" stroke="#7A96B6" stroke-width="1"/>
    <path d="M195 235 Q178 210 164 188" stroke="#8AA6C2" stroke-width="0.8" fill="none" opacity="0.5"/>
    <circle cx="160" cy="183" r="4" fill="#F0F0FF" opacity="0.7" filter="url(#tipGlow)"/>

    <!-- Blatt 4 — rechts oben -->
    <path d="M300 225 Q318 208 328 185 Q332 170 324 164 Q314 160 306 170 Q294 188 286 212 Q283 222 292 225 Z"
          fill="url(#leafSilverDark)" stroke="#7A96B6" stroke-width="1"/>
    <path d="M300 225 Q314 202 325 180" stroke="#8AA6C2" stroke-width="0.8" fill="none" opacity="0.5"/>
    <circle cx="327" cy="175" r="4" fill="#F0F0FF" opacity="0.7" filter="url(#tipGlow)"/>

    <!-- Blatt 5 — Mitte oben (kleiner) -->
    <path d="M238 195 Q228 172 225 148 Q224 134 232 128 Q240 125 246 135 Q252 152 250 178 Q249 188 243 193 Z"
          fill="url(#leafSilver)" stroke="#8FA8C8" stroke-width="1"/>
    <path d="M238 195 Q232 170 228 150" stroke="#9AB4CE" stroke-width="0.8" fill="none" opacity="0.5"/>
    <circle cx="227" cy="140" r="4" fill="#F0F0FF" opacity="0.9" filter="url(#tipGlow)"/>

    <!-- Perlmutt-Schimmer Overlay -->
    <path d="M200 290 Q175 275 160 250 Q155 235 165 225 Q175 218 190 225 Q210 240 225 270 Q230 280 220 288 Z"
          fill="url(#pearlSheen)" opacity="0.3"/>
    <path d="M310 265 Q335 250 350 225 Q355 210 345 200 Q335 195 320 205 Q300 220 285 250 Q280 260 290 265 Z"
          fill="url(#pearlSheen)" opacity="0.3"/>
  </g>

  <!-- === MONDPHASEN-PARTIKEL === -->
  <g filter="url(#particleGlow)">
    <!-- Vollmond -->
    <circle cx="155" cy="160" r="8" fill="#F0F0FF" opacity="0.6"/>
    <circle cx="155" cy="160" r="5" fill="#FFFFFF" opacity="0.8"/>

    <!-- Halbmond links -->
    <g transform="translate(340, 155)">
      <circle cx="0" cy="0" r="7" fill="#F0F0FF" opacity="0.5"/>
      <circle cx="3" cy="0" r="7" fill="#1A1A2E" opacity="0.9"/>
    </g>

    <!-- Mondsichel rechts oben -->
    <g transform="translate(280, 130)">
      <circle cx="0" cy="0" r="5" fill="#F0F0FF" opacity="0.5"/>
      <circle cx="-2" cy="-1" r="5" fill="#1A1A2E" opacity="0.9"/>
    </g>

    <!-- Neumond -->
    <circle cx="190" cy="140" r="5" fill="#F0F0FF" opacity="0.15"/>
    <circle cx="190" cy="140" r="5" fill="none" stroke="#F0F0FF" stroke-width="0.8" opacity="0.4"/>

    <!-- Kleine Leuchtpunkte -->
    <circle cx="175" cy="195" r="2.5" fill="#F0F0FF" opacity="0.7"/>
    <circle cx="320" cy="185" r="2" fill="#F0F0FF" opacity="0.5"/>
    <circle cx="230" cy="135" r="2" fill="#E1BEE7" opacity="0.6"/>
    <circle cx="295" cy="150" r="1.5" fill="#F0F0FF" opacity="0.4"/>
    <circle cx="210" cy="175" r="1.5" fill="#E1BEE7" opacity="0.5"/>
  </g>

  <!-- Kleiner Erdhügel -->
  <ellipse cx="256" cy="415" rx="55" ry="14" fill="#3E2723" opacity="0.7"/>
  <ellipse cx="256" cy="413" rx="48" ry="10" fill="#4E342E" opacity="0.8"/>
  <ellipse cx="256" cy="411" rx="40" ry="7" fill="#5D4037" opacity="0.6"/>

  <!-- === RARITÄTS-RAHMEN (Common = Weiß/Silber) === -->
  <rect x="6" y="6" width="500" height="500" rx="20" fill="none"
        stroke="url(#frameGrad)" stroke-width="6" opacity="0.9"/>
  <rect x="10" y="10" width="492" height="492" rx="18" fill="none"
        stroke="#F5F5F5" stroke-width="1" opacity="0.3"/>
</svg>
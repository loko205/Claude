[project]
name = "solana-trading-bot"
version = "0.1.0"
description = "Solana DEX arbitrage and momentum trading bot"
requires-python = ">=3.11"
dependencies = [
    "solders>=0.21.0",
    "solana>=0.34.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "websockets>=13.0",
    "rich>=13.0",
    "hyperliquid-python-sdk>=0.22.0",
    "eth-account>=0.13.0",
    "scipy>=1.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
